# ─────────────────────────────────────────────────────────────────────────────
# nav2_params.yaml  –  Bumpy Alpha Navigation Parameters
#
# Robot:        Bumpy Alpha  (differential drive, N20 motors, YDLiDAR)
# Namespace:    bumpy_alpha
# Map:          bumpy_map  (from bumpy_slam package)
# Features:     AMCL, NavFn planner, DWB controller, Collision Monitor, BT
# ─────────────────────────────────────────────────────────────────────────────

# ── AMCL ──────────────────────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time: false
    # Motion model noise (lower = trust odom more)
    alpha1: 0.1
    alpha2: 0.1
    alpha3: 0.1
    alpha4: 0.1
    alpha5: 0.1
    # Frames
    base_frame_id:   "bumpy_gamma/base_footprint"
    odom_frame_id:   "bumpy_gamma/odom"
    global_frame_id: "map"
    scan_topic:      /scan
    # Particle filter
    min_particles:  500
    max_particles:  2000
    pf_err:         0.05
    pf_z:           0.99
    resample_interval: 1
    # Update thresholds
    update_min_d:   0.15
    update_min_a:   0.15
    # Laser model
    laser_model_type:         "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_beams:          60
    max_beams:                60
    beam_skip_distance:       0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold:      0.3
    do_beamskip:              false
    sigma_hit:  0.2
    z_hit:      0.5
    z_max:      0.05
    z_rand:     0.5
    z_short:    0.05
    lambda_short: 2.4
    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    # Misc
    robot_model_type:  "nav2_amcl::DifferentialMotionModel"
    save_pose_rate:    0.5
    tf_broadcast:      true
    transform_tolerance: 2.0
    # Auto-set initial pose so AMCL publishes map→odom immediately
    set_initial_pose:  true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

# ── BT Navigator ──────────────────────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame:      map
    robot_base_frame:  bumpy_gamma/base_footprint
    odom_topic:        /bumpy_gamma/odom
    bt_loop_duration:  10
    default_server_timeout: 20
    # Custom BT XMLs (placed in bumpy_navigation/behavior_trees/)
    # default_nav_to_pose_bt_xml: ""
    # default_nav_through_poses_bt_xml: ""
    # plugin_lib_names: []

# ── Controller Server ─────────────────────────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time:   false
    use_stamped_vel: false         # publish Twist (unstamped) on /cmd_vel
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins:  ["general_goal_checker"]
    controller_plugins:    ["FollowPath"]

    # Progress checker
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance:  25.0

    # Goal checker
    general_goal_checker:
      stateful:         true
      plugin:           "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance:  0.15
      yaw_goal_tolerance: 0.20

    # DWB local planner – tuned for small slow robot
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x:    0.0
      min_vel_y:    0.0
      max_vel_x:    0.30     # m/s  – conservative for indoor robot
      max_vel_y:    0.0
      max_vel_theta: 2.0     # rad/s — matches velocity_smoother's angular cap
                             # (±1.5). Previously 2.0, which the smoother
                             # silently clamped, so DWB was scoring
                             # trajectories against a velocity it could
                             # never actually deliver downstream.
      min_speed_xy:  0.0
      max_speed_xy:  0.30
      min_speed_theta: 0.0
      acc_lim_x:     1.5
      acc_lim_y:     0.0
      acc_lim_theta: 3.2
      decel_lim_x:  -1.5
      decel_lim_y:   0.0
      decel_lim_theta: -3.2
      vx_samples:     20
      vy_samples:      5
      vtheta_samples: 20
      sim_time:       2.0
      linear_granularity:  0.05
      angular_granularity: 0.025
      transform_tolerance: 2.0
      xy_goal_tolerance:   0.15
      trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
        - "RotateToGoal"
        - "Oscillation"
        - "BaseObstacle"
        - "GoalAlign"
        - "PathAlign"
        - "PathDist"
        - "GoalDist"
      BaseObstacle.scale: 0.02
      PathAlign.scale: 48.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 48.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ── Local Costmap ─────────────────────────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency:   5.0
      publish_frequency:  2.0
      global_frame:       bumpy_gamma/odom
      robot_base_frame:   bumpy_gamma/base_footprint
      use_sim_time:       false
      rolling_window:     true
      width:  3
      height: 3
      resolution: 0.05
      robot_radius: 0.12      # ~12 cm — tight fit for Bumpy Alpha body
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic:              /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
          reliability_policy: "best_effort"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius:    0.25
      always_send_full_costmap: true

# ── Global Costmap ────────────────────────────────────────────────────────────
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency:   1.0
      publish_frequency:  1.0
      global_frame:  map
      robot_base_frame: bumpy_gamma/base_footprint
      use_sim_time:  false
      robot_radius:  0.12
      resolution:    0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic:               /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.12
          obstacle_max_range: 2.5
          obstacle_min_range: 0.12
          reliability_policy: "best_effort"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius:    0.30
      always_send_full_costmap: true

# ── Map Server ────────────────────────────────────────────────────────────────
map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""      # Overridden by launch file to bumpy_map.yaml

# ── Map Saver ─────────────────────────────────────────────────────────────────
map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ── Planner Server (NavFn / A*) ───────────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin:        "nav2_navfn_planner::NavfnPlanner"
      tolerance:     0.5
      use_astar:     true    # A* → faster in corridors than Dijkstra
      allow_unknown: true

# ── Smoother Server ───────────────────────────────────────────────────────────
smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── Behavior Server (formerly recoveries_server) ──────────────────────────────
behavior_server:
  ros__parameters:
    costmap_topic:   local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    # FIX: local_frame is what spin/backup plugins use for
    # transformPoseInTargetFrame — defaults to "odom" which doesn't
    # exist with our namespaced frames.  Must match the odom frame.
    local_frame:       bumpy_gamma/odom
    global_frame:      bumpy_gamma/odom
    robot_base_frame:  bumpy_gamma/base_footprint
    transform_timeout: 1.0
    use_sim_time:      false
    simulate_ahead_time: 2.0
    max_rotational_vel:  1.0
    min_rotational_vel:  0.4
    rotational_acc_lim:  3.2

# ── Waypoint Follower ─────────────────────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate:    20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

# ── Velocity Smoother ─────────────────────────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time:        false
    smoothing_frequency: 20.0
    scale_velocities:    false
    feedback:            "OPEN_LOOP"
    max_velocity:     [0.30, 0.0, 2.0]
    min_velocity:    [-0.30, 0.0, -2.0]
    max_accel:        [1.5,  0.0, 2.5]
    max_decel:       [-1.5,  0.0, -2.5]
    odom_topic:          /bumpy_gamma/odom
    odom_duration:       0.1
    deadband_velocity:   [0.0, 0.0, 0.0]
    velocity_timeout:    1.0

# ── Collision Monitor ─────────────────────────────────────────────────────────
collision_monitor:
  ros__parameters:
    use_sim_time:             false
    base_frame_id:            bumpy_gamma/base_footprint
    odom_frame_id:            bumpy_gamma/odom
    cmd_vel_in_topic:         cmd_vel_smoothed   # input from velocity smoother
    cmd_vel_out_topic:        /bumpy_gamma/cmd_vel   # output to the robot
    state_topic:              collision_monitor/state
    transform_tolerance:      0.5
    source_timeout:           2.0
    base_shift_correction:    true
    stop_pub_timeout:         2.0

    # ── Observation sources ─────────────────────────────────────────────────
    observation_sources: [scan]
    scan:
      type:            scan
      topic:           /scan
      min_height:      0.05
      max_height:      0.50
      enabled:         true
      reliability_policy: "best_effort"

    # ── Polygons ────────────────────────────────────────────────────────────
    # Robot radius = 0.12 m.  Polygons must be OUTSIDE the body.
    polygons: ["PolygonStop", "PolygonSlowdown"]

    PolygonStop:
      type:              polygon
      # Uniform ~6 cm clearance on ALL sides — required because in-place
      # rotation sweeps the robot's full body through every direction,
      # not just forward. The previous front-loaded rectangle
      # ([0.20,0.16]..[-0.16,-0.16]) gave a much tighter margin on the
      # sides/rear than up front, so a turn-in-place would false-trigger
      # PolygonStop against anything within that tighter margin.
      # NOTE: verify against your chassis's actual corner-to-center
      # distance (not just the nominal robot_radius: 0.12) and adjust.
      points:            "[[0.18, 0.18], [0.18, -0.18], [-0.18, -0.18], [-0.18, 0.18]]"
      action_type:       stop
      min_points:        5           # require ≥5 laser points to avoid noise
      visualize:         true
      polygon_pub_topic: "collision_monitor/polygon_stop"
      enabled:           true

    PolygonSlowdown:
      type:              polygon
      # Uniform slowdown margin, same rationale as PolygonStop above.
      points:            "[[0.30, 0.24], [0.30, -0.24], [-0.20, -0.24], [-0.20, 0.24]]"
      action_type:       slowdown
      slowdown_ratio:    0.5         # reduce velocity to 50 %
      min_points:        4
      visualize:         true
      polygon_pub_topic: "collision_monitor/polygon_slowdown"
      enabled:           true

# ── Lifecycle Managers ────────────────────────────────────────────────────────
lifecycle_manager_localization:
  ros__parameters:
    use_sim_time:  false
    autostart:     true
    bond_timeout:  0.0
    bond_disable_heartbeat_timeout: true
    node_names:
      - map_server
      - amcl

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time:  false
    autostart:     true
    bond_timeout:  0.0
    bond_disable_heartbeat_timeout: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor
      - docking_server

lifecycle_manager:
  ros__parameters:
    use_sim_time:  false
    autostart:     true
    bond_timeout:  0.0
    bond_disable_heartbeat_timeout: true
    node_names:
      - map_server
      - amcl
      - planner_server
      - controller_server
      - smoother_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother
      - collision_monitor
      - docking_server

# ── Docking Server (Required by Jazzy nav2_bringup) ───────────────────────────
docking_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: "bumpy_gamma/base_footprint"
    odom_frame: "bumpy_gamma/odom"
    dock_plugins: ['simple_charging_dock']
    simple_charging_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.05
      staging_distance: 0.5
      use_external_detection_pose: false
      use_battery_status: false
